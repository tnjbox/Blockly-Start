name: Deploy to GitHub Pages

# 2026-08-13新增：解決複製這份範本後「第一次沒有人部署過、gh-pages分支不存在」的問題。
# 每次push到main分支就自動build+部署，不需要任何人在自己電腦上跑npm/Node.js。
# 複製這份範本的人唯一要做的一次性設定：repo的 Settings -> Pages -> Source
# 選「GitHub Actions」（不是「Deploy from a branch」）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
